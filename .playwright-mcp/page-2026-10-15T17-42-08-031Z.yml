  - generic [ref=f177e291]:
    - generic [ref=f177e292]: Features - Free to Play
    - generic [ref=f177e296]:
      - generic [ref=f177e297]:
        - generic [ref=f177e298]: Core Platform Features
        - list [ref=f177e299]:
          - listitem [ref=f177e300]: Host games for and play with anyone - no licenses needed
          - listitem [ref=f177e301]: Full Game Master and Player functionality included
          - listitem [ref=f177e302]: Cross-platform play (Windows, MacOS, Linux)
          - listitem [ref=f177e303]: Cloud connectivity with no networking hassles - automatic NAT traversal
          - listitem [ref=f177e304]: Powerful automation for combat, initiative, attacks, saves, damage, conditions, and effects
          - listitem [ref=f177e305]: Dynamic Line of Sight, Lighting, and Vision (including Darkvision support)
          - listitem [ref=f177e306]: Built-in dice roller with 3D dice and advanced modifiers
          - listitem [ref=f177e307]: Toggle between 2D top-down view and 2.5D Camera or Token View for increased immersion
      - generic [ref=f177e308]:
        - generic [ref=f177e309]: Creation & Customization
        - list [ref=f177e310]:
          - listitem [ref=f177e311]: Build and manage unlimited campaigns
          - listitem [ref=f177e312]: Customize notes, story entries, NPCs, encounters, items, and quests
          - listitem [ref=f177e313]: Create and export your own custom adventure modules
          - listitem [ref=f177e314]: Ability to create your own custom extensions or rulesets with XML and LUA
          - listitem [ref=f177e315]: Create layered art and maps with advanced image tools
          - listitem [ref=f177e316]: Export images or tokens as webp
      - generic [ref=f177e317]:
        - generic [ref=f177e318]: Free Content & Community
        - list [ref=f177e319]:
          - listitem [ref=f177e320]: More than 100 Free Tokens and camera view images for male and female fantasy heroes *
          - listitem [ref=f177e321]: Nearly 500 Fantasy tokens and camera view images for SRD monsters *
          - listitem [ref=f177e322]: More than 200 Generic Top-down Tokens (Animals, Characters, Monsters)
          - listitem [ref=f177e323]: Over 20 Free battlemaps for streets, caves, dungeons and tunnels
          - listitem [ref=f177e324]: Dozens of Free full color commissioned portraits by Mates Laurentiu
          - listitem [ref=f177e325]: Shockbolt GMW Kit Asset Pack with over 600 pieces of art for tiles, effects, floors and more
          - listitem [ref=f177e326]: Saz Asset Pack with around 100 pieces of art for tiles, brushes, floors and more
          - listitem [ref=f177e327]: Torsten's Asset Pack with over 260 pieces of art for tiles, terrain, markers and more
          - listitem [ref=f177e328]:
            - text: Access to the
