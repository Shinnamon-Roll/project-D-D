        - heading "Fantasy Grounds Forge" [level=2] [ref=f177e285]
        - generic [ref=f177e286]: The Fantasy Grounds Forge (the FG Forge or FGF) is a community developer portal where creators can share content for free or sell it. Forge users can then purchase or subscribe to content and use the creations in their games!
        - link "Go to the Forge" [ref=f177e287] [cursor=pointer]:
          - /url: https://forge.fantasygrounds.com/
