                - heading "Feature Breakdown" [level=1] [ref=f4e46]
                - time [ref=f4e52]: November 18, 2025 at 12:32 AM
                - generic [ref=f4e57]:
                  - paragraph [ref=f4e58]: We rely on support from our community to operate Roll20. Your support keeps us going and helps us improve Roll20 and develop new features.
                  - paragraph [ref=f4e59]:
                    - text: If you enjoy using Roll20 and want to help us continue to grow, please consider supporting us with a
                    - link "subscription" [ref=f4e60] [cursor=pointer]:
                      - /url: https://app.roll20.net/why-subscribe-to-roll20
                    - text: .
                  - paragraph [ref=f4e61]: Below you will find a list of the different features and perks that are available at different subscription levels on Roll20.
                  - heading "Free" [level=1] [ref=f4e62]
                  - paragraph [ref=f4e63]:
                    - strong [ref=f4e64]: "Price: Free!"
                  - paragraph [ref=f4e65]: "All users regardless of subscription recieve the following benefits while using Roll20:"
                  - list [ref=f4e66]:
                    - listitem [ref=f4e67]: Dedicated Online Hosting with unlimited players and games!
                    - listitem [ref=f4e68]: Access to over 1,200+ Game Systems
                    - listitem [ref=f4e69]:
                      - text: Owned Content Sharing
                      - list [ref=f4e70]:
                        - listitem [ref=f4e71]: Free users can share within 1 game at a time and up to 5 players within that game.
                    - listitem [ref=f4e72]:
                      - link "100 MB Upload Storage" [ref=f4e73] [cursor=pointer]:
                        - /url: https://help.roll20.net/hc/articles/360037256634
                      - list [ref=f4e74]:
                        - listitem [ref=f4e75]: Maximum upload size of 20 MB
                    - listitem [ref=f4e76]:
                      - link "2 active Looking For Group listings" [ref=f4e77] [cursor=pointer]:
                        - /url: https://help.roll20.net/hc/articles/360037774473
                    - listitem [ref=f4e78]:
                      - link "Limited Character Transfers (3 per Game)" [ref=f4e79] [cursor=pointer]:
                        - /url: https://help.roll20.net/hc/articles/360037258594
                  - heading "Plus" [level=1] [ref=f4e80]
                  - paragraph [ref=f4e81]:
                    - strong [ref=f4e82]: "Price: $5.99/mo or $59.99/yr"
                  - paragraph [ref=f4e83]: "Plus subscribers continue to benefit from the above features along with a few additions:"
                  - list [ref=f4e84]:
                    - listitem [ref=f4e85]:
                      - text: Owned content sharing is increased
                      - list [ref=f4e86]:
                        - listitem [ref=f4e87]: Plus subscribers can share within 3 games at a time and up to 10 players within each of those games.
                    - listitem [ref=f4e88]:
                      - link "4 GB Upload Storage" [ref=f4e89] [cursor=pointer]:
                        - /url: https://help.roll20.net/hc/articles/360037256634
                      - list [ref=f4e90]:
                        - listitem [ref=f4e91]: Maximum upload size of 50 MB (Except Audio which remains 20 MB)
                    - listitem [ref=f4e92]:
                      - link "Unlimited Looking For Group listings" [ref=f4e93] [cursor=pointer]:
                        - /url: https://help.roll20.net/hc/articles/360037774473
                    - listitem [ref=f4e94]:
                      - link "Dynamic Lighting" [ref=f4e95] [cursor=pointer]:
                        - /url: https://help.roll20.net/hc/articles/4403801475479-What-Is-Dynamic-Lighting
                    - listitem [ref=f4e96]:
                      - text: Shared Table Features
                      - list [ref=f4e97]:
                        - listitem [ref=f4e98]: Games created by subscribers will confer many features to players and Co-GMs within that game!
                    - listitem [ref=f4e99]: External Journal Access
                    - listitem [ref=f4e100]:
                      - link "Unlimited Character Transfers" [ref=f4e101] [cursor=pointer]:
                        - /url: https://help.roll20.net/hc/articles/360037258594
                    - listitem [ref=f4e102]: No Loadscreen Ads
                    - listitem [ref=f4e103]: Demiplane Unlimited
                    - listitem [ref=f4e104]: A "Plus" profile badge added to your account and forum posts.
                  - heading "Pro" [level=1] [ref=f4e105]
